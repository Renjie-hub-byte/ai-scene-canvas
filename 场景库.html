<!DOCTYPE html>

<title>场景库 · 牛马通用 / 销售专场</title>
<style>
  :root{
    --bg:#f5f6f8;
    --surface:#ffffff;
    --line:#e8eaef;
    --line-soft:#f0f1f4;
    --text:#1b1f27;
    --text-2:#5b6270;
    --text-3:#8b929f;
    --accent:#2f6bf0;
    --accent-soft:#eaf1ff;
    --accent-2:#4b8bff;
    --warn:#e2542c;
    --warn-soft:#fdeee8;
    --ok:#12886a;
    --radius:16px;
    --shadow:0 1px 2px rgba(20,28,45,.04), 0 8px 24px rgba(20,28,45,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px}

  /* ---------- Hero ---------- */
  .hero{padding:56px 0 30px;text-align:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;letter-spacing:.08em;color:var(--text-3);
    background:var(--surface);border:1px solid var(--line);
    padding:5px 14px;border-radius:999px;margin-bottom:20px;
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
  .hero h1{font-size:34px;line-height:1.35;font-weight:700;letter-spacing:-.01em}
  .hero h1 em{font-style:normal;color:var(--accent)}
  .hero p{margin-top:12px;color:var(--text-2);font-size:15px;max-width:660px;margin-left:auto;margin-right:auto}

  .hero-legend{
    margin:20px auto 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
    font-size:12.5px;color:var(--text-3);
  }
  .hero-legend .bdg{margin-left:0}
  .hero-legend .sp{width:1px;height:12px;background:var(--line);display:inline-block;margin:0 6px}

  /* ---------- Tabs ---------- */
  .tabbar{
    position:sticky;top:0;z-index:40;
    background:rgba(245,246,248,.86);
    backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid transparent;
    padding:14px 0;
  }
  .tabbar.stuck{border-bottom-color:var(--line)}
  .tablist{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .tab{
    border:1px solid var(--line);background:var(--surface);color:var(--text-2);
    padding:9px 20px;border-radius:999px;font-size:14.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:9px;
    transition:.18s ease;font-family:inherit;
  }
  .tab:hover{border-color:#d3d8e2;color:var(--text)}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:#cfd4de;transition:.18s}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(27,31,39,.14)}
  .tab.active .dot{background:#fff}
  .tab .cnt{font-size:12px;opacity:.72}
  .tab.more{
    border-style:dashed;color:var(--text-3);cursor:default;background:transparent;
  }
  .tab.more:hover{border-color:var(--line);color:var(--text-3)}

  /* ---------- Section head ---------- */
  .sec-head{padding:34px 0 6px}
  .sec-head h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
  .sec-head h2 span.bar{width:4px;height:18px;border-radius:2px;background:var(--accent);display:block}
  .sec-head p{color:var(--text-2);font-size:14px;margin-top:8px;max-width:760px}

  /* ---------- Cards ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:16px;padding:22px 0 60px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 18px;cursor:pointer;position:relative;overflow:hidden;
    transition:.2s ease;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#dbe0e9}
  .card .no{
    font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent);
    background:var(--accent-soft);border-radius:8px;padding:3px 9px;display:inline-block;
  }
  .card h3{font-size:17px;font-weight:650;margin-top:13px;line-height:1.45}
  .bdg{
    display:inline-block;font-size:11px;font-weight:600;line-height:1.5;color:var(--accent);
    background:var(--accent-soft);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px;
  }
  .bdg.custom{
    color:#9a5b12;background:#fff5e9;border:1px solid #f2dcbe;
  }
  .bdg.sys{color:#33578c;background:#eef3fb;border:1px solid #d3e0f2}
  .bdg.life{color:#5b6474;background:#eef0f4;border:1px solid #e2e6ed}
  .roles{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .role{
    font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    border-radius:20px;padding:2px 9px;line-height:1.6;
  }
  .sheet-head .sub .role{font-size:11px;padding:1px 8px;margin-left:6px}
  .card .tag{color:var(--text-2);font-size:13.5px;margin-top:7px;min-height:40px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{
    font-size:12px;color:var(--text-2);background:#f4f5f8;border:1px solid var(--line-soft);
    padding:3px 9px;border-radius:6px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .foot{
    margin-top:16px;padding-top:13px;border-top:1px dashed var(--line);
    display:flex;align-items:center;justify-content:space-between;
    color:var(--text-3);font-size:13px;
  }
  .card .foot b{color:var(--accent);font-weight:600}
  .card:hover .foot b{text-decoration:underline}

  /* ---------- Modal ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(17,22,34,.42);backdrop-filter:blur(3px);
    z-index:100;opacity:0;pointer-events:none;transition:.22s ease;
  }
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);
    background:var(--bg);z-index:101;transform:translateX(102%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;box-shadow:-16px 0 48px rgba(15,22,40,.16);
  }
  .sheet.on{transform:translateX(0)}
  .sheet-head{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:20px 28px;display:flex;align-items:flex-start;gap:14px;flex:none;
  }
  .sheet-head .no{
    font-size:13px;font-weight:700;color:#fff;background:var(--accent);
    border-radius:8px;padding:3px 10px;margin-top:4px;flex:none;
  }
  .sheet-head h2{font-size:19px;font-weight:650;line-height:1.45}
  .sheet-head .sub{color:var(--text-2);font-size:13.5px;margin-top:4px}
  .close{
    margin-left:auto;flex:none;width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);background:#fff;color:var(--text-2);
    cursor:pointer;font-size:17px;line-height:1;font-family:inherit;
  }
  .close:hover{background:#f5f6f9;color:var(--text)}
  .sheet-body{overflow-y:auto;padding:24px 28px 60px;flex:1}

  .blk{margin-bottom:24px}
  .blk .lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text-3);letter-spacing:.04em;margin-bottom:10px}
  .blk .lb i{width:5px;height:5px;border-radius:50%;background:var(--text-3);display:block}
  .quote{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid #c9cfdb;
    border-radius:10px;padding:14px 16px;color:var(--text-2);font-size:14px;line-height:1.8;
  }
  .plist{display:flex;flex-direction:column;gap:8px}
  .plist li{
    list-style:none;display:flex;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--text-2);line-height:1.6;
  }
  .plist li .k{
    flex:none;width:19px;height:19px;border-radius:50%;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:3px;
  }
  .pain .k{background:var(--warn-soft);color:var(--warn)}
  .hope .k{background:var(--accent-soft);color:var(--accent)}

  /* ---------- 画面：聊天窗 ---------- */
  .stage{
    background:linear-gradient(180deg,#eef1f6 0%,#e9edf3 100%);
    border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .stage .cap{font-size:12px;color:var(--text-3);text-align:center;margin-bottom:10px;letter-spacing:.05em}
  .phone{
    background:#fff;border-radius:12px;overflow:hidden;
    box-shadow:0 2px 10px rgba(20,28,45,.07);border:1px solid #e3e7ee;
  }
  .phone-top{
    display:flex;align-items:center;gap:10px;padding:11px 14px;
    background:#fbfcfd;border-bottom:1px solid #eef0f4;
  }
  .ava{
    width:30px;height:30px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .phone-top .nm{font-size:14px;font-weight:600;line-height:1.3}
  .phone-top .st{font-size:11.5px;color:var(--ok);display:flex;align-items:center;gap:5px}
  .phone-top .st i{width:5px;height:5px;border-radius:50%;background:var(--ok);display:block}
  .phone-top .more-dots{margin-left:auto;color:#c3c8d2;font-size:15px;letter-spacing:2px}
  .chat{padding:16px 14px;display:flex;flex-direction:column;gap:13px;background:#f7f8fa}
  .time{align-self:center;font-size:11.5px;color:#a6acb8;background:#eceef2;padding:2px 10px;border-radius:999px}
  .push{
    align-self:center;font-size:11.5px;color:var(--warn);background:#fff;
    border:1px solid #f3d6cb;padding:2px 10px;border-radius:999px;display:flex;gap:6px;align-items:center;
  }
  .push i{width:5px;height:5px;border-radius:50%;background:var(--warn);display:block}
  .row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
  .row.me{flex-direction:row-reverse}
  .row .pic{width:28px;height:28px;border-radius:8px;flex:none;background:#e6e9ef;color:#8b929f;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .row.me .pic{background:var(--accent-soft);color:var(--accent)}
  .bub{
    background:#fff;border:1px solid #e9ecf1;border-radius:4px 12px 12px 12px;
    padding:11px 14px;font-size:13.8px;line-height:1.75;color:#262c38;max-width:78%;
    box-shadow:0 1px 2px rgba(20,28,45,.04);
  }
  .row.me .bub{
    background:var(--accent);border-color:var(--accent);color:#fff;border-radius:12px 4px 12px 12px;
    box-shadow:0 2px 8px rgba(20,28,45,.16);
  }
  .bub b{font-weight:650}
  .bub .hi{background:#fff5e8;padding:0 3px;border-radius:3px;color:#b4520f}
  .bub ol,.bub ul{margin:6px 0 2px 0;padding-left:18px}
  .bub li{margin:3px 0}
  .bub .quote-min{
    display:block;margin:8px 0 4px;padding:9px 12px;border-left:3px solid #dbe1ea;
    background:#f7f8fb;border-radius:0 8px 8px 0;color:#4a5266;font-size:13.2px;
  }
  .bub .hr{height:1px;background:#eef0f4;margin:9px 0}
  .bub .code{
    display:block;margin:8px 0;padding:10px 12px;border:1px solid #e4e8ef;border-radius:8px;
    background:#f6f8fb;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.2px;line-height:1.65;color:#39435a;white-space:pre-wrap;word-break:break-all;
  }
  .bub.ask{max-width:90%}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:11px;padding-top:11px;border-top:1px dashed #e2e7ef}
  .opt{
    width:100%;text-align:left;font-family:inherit;font-size:13.2px;line-height:1.55;color:#39435a;
    background:#fff;border:1px solid #e0e5ee;border-radius:9px;padding:9px 12px;cursor:pointer;
    display:flex;gap:9px;align-items:flex-start;transition:.15s;
  }
  .opt:hover{border-color:var(--accent);color:var(--accent)}
  .opt .mk{
    width:15px;height:15px;border-radius:50%;border:1.5px solid #d3d9e3;flex:none;margin-top:3px;
    display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;
  }
  .opt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .opt.on .mk{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt.on .mk::after{content:'✓'}
  .opt-note{font-size:11.5px;color:#98a0ad;margin-top:7px}
  .doc{
    display:flex;gap:11px;align-items:center;background:#fff;border:1px solid #e9ecf1;
    border-radius:10px;padding:11px 13px;margin-top:9px;max-width:260px;
    box-shadow:0 1px 2px rgba(20,28,45,.04);
  }
  .doc .ic{
    width:32px;height:32px;border-radius:7px;flex:none;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  }
  .doc .t{font-size:13.2px;font-weight:600;line-height:1.4;color:#262c38}
  .doc .d{font-size:11.5px;color:#98a0ad;margin-top:1px}
  .typing{display:flex;gap:4px;align-items:center;padding:2px 0}
  .typing span{width:5px;height:5px;border-radius:50%;background:#b9c0cc;animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .phone-bot{
    display:flex;align-items:center;gap:9px;padding:10px 14px;background:#fbfcfd;border-top:1px solid #eef0f4;
  }
  .phone-bot .inp{flex:1;background:#fff;border:1px solid #e6e9ef;border-radius:999px;padding:6px 14px;font-size:12.5px;color:#a8aeb9}
  .phone-bot .btn{font-size:12px;color:#fff;background:var(--accent);border-radius:999px;padding:6px 14px;font-weight:600}

  .fade{opacity:0;transform:translateY(8px)}
  .grid.in .card{animation:up .34s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes up{to{opacity:1;transform:none}}

  /* ---------- 主题色 ----------
     每个主题只声明 3 个变量：--accent（主色）/ --accent-2（渐变亮端）/ --accent-soft（浅底）。
     新增角色 Tab 时，在这里加一行即可，其余样式全部自动跟随。 */
  .tab.blue,.sec-head.blue,.card.blue,.sheet-head.blue,.sheet-body.blue{--accent:#2f6bf0;--accent-2:#4b8bff;--accent-soft:#eaf1ff}
  .tab.orange,.sec-head.orange,.card.orange,.sheet-head.orange,.sheet-body.orange{--accent:#e2542c;--accent-2:#ff8a5c;--accent-soft:#fdeee8}
  .tab.purple,.sec-head.purple,.card.purple,.sheet-head.purple,.sheet-body.purple{--accent:#6b4ee8;--accent-2:#8f74ff;--accent-soft:#efecff}
  .tab.teal,.sec-head.teal,.card.teal,.sheet-head.teal,.sheet-body.teal{--accent:#0d9488;--accent-2:#2dd4bf;--accent-soft:#e6f6f4}
  .tab.slate,.sec-head.slate,.card.slate,.sheet-head.slate,.sheet-body.slate{--accent:#475569;--accent-2:#8494ad;--accent-soft:#eef1f5}
  .tab.pink,.sec-head.pink,.card.pink,.sheet-head.pink,.sheet-body.pink{--accent:#db2777;--accent-2:#f472b6;--accent-soft:#fdebf4}
  .tab.green,.sec-head.green,.card.green,.sheet-head.green,.sheet-body.green{--accent:#16a34a;--accent-2:#4ade80;--accent-soft:#e8f7ee}
  .tab.amber,.sec-head.amber,.card.amber,.sheet-head.amber,.sheet-body.amber{--accent:#b45309;--accent-2:#f59e0b;--accent-soft:#fdf3e7}

  footer{border-top:1px solid var(--line);padding:26px 0 46px;color:var(--text-3);font-size:12.5px;text-align:center}

  @media (max-width:720px){
    .wrap{padding:0 16px}
    .hero h1{font-size:26px}
    .sheet-body{padding:18px 18px 50px}
    .sheet-head{padding:16px 18px}
    .bub{max-width:86%}
  }
</style>
</head>

/* ================= 渲染 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const themeCls = t => t.theme==='blue' ? '' : t.theme;
let cur = 0;

function renderTabs(){
  $('#tablist').innerHTML = TABS.map((t,i)=>
    `<button class="tab ${themeCls(t)} ${i===cur?'active':''}" data-i="${i}">
       <span class="dot"></span>${t.name}<span class="cnt">${t.scenes.length}</span>
     </button>`).join('')
    + `<span class="tab more" title="后续可扩展：市场 / 营销、研发 / 设计 / 视频 / 数据分析 / 产品 / 财务 / 法务…">＋ 更多角色场景</span>`;
  $('#tablist').querySelectorAll('.tab:not(.more)').forEach(b=>{
    b.onclick = ()=>{ cur = +b.dataset.i; renderTabs(); renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}

const badgeList = s => s.badges || (s.badge ? [s.badge] : []);
const badgeCls = b => b==='定制' ? 'custom' : (b==='系统打通' ? 'sys' : (b==='生活场景' ? 'life' : ''));
const badgesHtml = s => badgeList(s).map(b=>
  `<span class="bdg ${badgeCls(b)}">${b}</span>`).join('');
const rolesHtml = s => (s.roles && s.roles.length)
  ? `<div class="roles">${s.roles.map(r=>`<span class="role">${r}</span>`).join('')}</div>` : '';

function renderGrid(){
  const t = TABS[cur];
  const cls = themeCls(t);
  $('#secHead').className = 'sec-head' + (cls?' '+cls:'');
  $('#secHead').innerHTML = `
    <h2><span class="bar ${cls}"></span>${t.name}<span style="font-weight:400;color:var(--text-3);font-size:14px">· ${t.scenes.length} 个场景</span></h2>
    <p>${t.desc}</p>`;
  const g = $('#grid');
  g.classList.remove('in');
  g.innerHTML = t.scenes.map((s,i)=>`
    <article class="card ${cls} fade" style="animation-delay:${i*35}ms" data-i="${i}">
      <span class="no">${s.no}</span>
      <h3>${s.title}${badgesHtml(s)}</h3>
      ${rolesHtml(s)}
      <div class="tag">${s.tag}</div>
      <div class="chips">${s.pains.slice(0,2).map(p=>`<span class="chip">${p}</span>`).join('')}</div>
      <div class="foot"><span>现状 · 痛点 · 期待 · 画面</span><b>看画面 →</b></div>
    </article>`).join('');
  void g.offsetWidth;
  g.classList.add('in');
  g.querySelectorAll('.card').forEach(c=> c.onclick = ()=> openScene(+c.dataset.i));
}

function bubbleHtml(m, cls){
  if(m.r==='time') return `<div class="time">${m.t}</div>`;
  if(m.r==='push') return `<div class="push"><i></i>${m.t}</div>`;
  const rowCls = ['row', m.r==='me'?'me':'', cls&&m.r==='me'?cls:''].join(' ');
  const avatar = m.r==='me' ? '我' : 'AI';
  let body = m.t;
  if(m.opts && m.opts.length){
    body += `<div class="opts">${m.opts.map((o,i)=>
      `<button type="button" class="opt ${m.pick===i?'on':''}"><span class="mk">✓</span><span>${o}</span></button>`
    ).join('')}</div>` + (m.note?`<div class="opt-note">${m.note}</div>`:'');
  }
  if(m.doc){
    body += `<div class="doc ${cls}"><div class="ic">DOC</div><div><div class="t">${m.doc.t}</div><div class="d">${m.doc.d}</div></div></div>`;
  }
  return `<div class="${rowCls}"><div class="pic">${avatar}</div><div class="bub">${body}</div></div>`;
}

function openScene(i){
  const t = TABS[cur], s = t.scenes[i];
  const cls = themeCls(t);
  const head = $('#sheetHead');
  head.className = 'sheet-head' + (cls?' '+cls:'');
  head.innerHTML = `
    <span class="no">${s.no}</span>
    <div><h2>${s.title}</h2><div class="sub">${t.name}${s.roles&&s.roles.length?' · '+s.roles.join(' · '):''} · ${s.tag}${badgesHtml(s)}</div></div>
    <button class="close" id="closeBtn">×</button>`;
  $('#sheetBody').innerHTML = `
    <div class="blk">
      <div class="lb"><i></i>现在是怎么做的</div>
      <div class="quote">${s.status}</div>
    </div>
    <div class="blk">
      <div class="lb"><i></i>卡在哪（${s.pains.length}）</div>
      <ul class="plist pain">${s.pains.map((p,k)=>`<li><span class="k">${k+1}</span><span>${p}</span></li>`).join('')}</ul>
    </div>
    <div class="blk">
      <div class="lb"><i></i>期望 Agent 做到什么（${s.hopes.length}）</div>
      <ul class="plist hope ${cls}">${s.hopes.map((p,k)=>`<li><span class="k">${k+1}</span><span>${p}</span></li>`).join('')}</ul>
    </div>
    <div class="blk" style="margin-bottom:0">
      <div class="lb"><i></i>画面：它跑起来长这样</div>
      <div class="stage">
        <div class="cap">— 对 话 窗 口 —</div>
        <div class="phone">
          <div class="phone-top ${cls}">
            <div class="ava">AI</div>
            <div><div class="nm">工作助理</div><div class="st"><i></i>在线 · 已接入各端口</div></div>
            <div class="more-dots">···</div>
          </div>
          <div class="chat">${s.chat.map(m=>bubbleHtml(m,cls)).join('')}
            <div class="row ${cls}"><div class="pic">AI</div><div class="bub" style="padding:9px 14px"><div class="typing"><span></span><span></span><span></span></div></div></div>
          </div>
          <div class="phone-bot ${cls}">
            <div class="inp">说点什么…</div><div class="btn">发送</div>
          </div>
        </div>
      </div>
    </div>`;
  $('#mask').classList.add('on');
  $('#sheet').classList.add('on');
  $('#sheetBody').className = 'sheet-body' + (cls?' '+cls:'');
  document.body.style.overflow='hidden';
  $('#closeBtn').onclick = closeSheet;
  $('#sheetBody').scrollTop = 0;
}
function closeSheet(){
  $('#mask').classList.remove('on');
  $('#sheet').classList.remove('on');
  document.body.style.overflow='';
}
$('#mask').onclick = closeSheet;
$('#sheetBody').addEventListener('click', e=>{
  const b = e.target.closest && e.target.closest('.opt');
  if(!b) return;
  b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
window.addEventListener('scroll', ()=>{
  $('#tabbar').classList.toggle('stuck', window.scrollY > 90);
});

renderTabs();
renderGrid();
</script>
</body>
</html>
